name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest   # ws_test.py 依赖 pytest（http 为标准库）

      - name: Migration smoke (empty sqlite -> head)
        run: alembic upgrade head
        env:
          ALEMBIC_DATABASE_URL: sqlite:///./ci_migrate.db

      - name: Integration tests
        run: |
          python smoke_test.py
          python auth_test.py
          python alerts_test.py
          python sessions_test.py
          python v05_test.py
          python v06_test.py
          python v07_test.py
          python sso_test.py
          python feedback_test.py
          python ws_test.py
          python otel_test.py
          python langsmith_compat_test.py
        env:
          DATABASE_URL: sqlite:///./ci_test.db

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: SDK tests
        run: python test_sdk.py
