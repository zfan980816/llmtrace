[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmtrace-sdk"
version = "0.1.0"
description = "LLMTrace SDK - one-line LLM observability for OpenAI / Anthropic and plain functions"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "LLMTrace Contributors" }]
keywords = ["llm", "observability", "tracing", "openai", "anthropic", "langsmith-alternative"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/llmtrace/llmtrace"

[tool.setuptools.packages.find]
include = ["llmtrace*"]
